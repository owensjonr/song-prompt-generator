<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.mzstatic.com; media-src https://*.apple.com https://*.mzstatic.com; connect-src 'none'; object-src 'none'; base-uri 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Song Prompt Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <nav class="rail" aria-label="Sections">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="brand-name">Song Prompt<br />Studio</span>
      </div>
      <button class="rail-btn is-active" data-view="build">Build a prompt</button>
      <button class="rail-btn" data-view="explore">Explore genres</button>
      <button class="rail-btn" data-view="research">Prompt research <span class="count" id="researchCount"></span></button>
      <button class="rail-btn" data-view="lyrics">Lyrics lab</button>
      <button class="rail-btn" data-view="examples">Example prompts</button>
      <button class="rail-btn" data-view="glossary">Music terms</button>
      <button class="rail-btn" data-view="saved">Saved <span class="count" id="savedCount"></span></button>
      <div class="rail-foot">
        <label class="switch">
          <input type="checkbox" id="tipsToggle" checked />
          <span>Beginner tips</span>
        </label>
      </div>
    </nav>

    <main class="main" id="main">
      <section class="view is-active" id="view-build"></section>
      <section class="view" id="view-explore"></section>
      <section class="view" id="view-research"></section>
      <section class="view" id="view-lyrics"></section>
      <section class="view" id="view-examples"></section>
      <section class="view" id="view-glossary"></section>
      <section class="view" id="view-saved"></section>
    </main>

    <aside class="output" id="output" aria-label="Generated prompt"></aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data/genres.js"></script>
  <script src="data/vocab.js"></script>
  <script src="data/examples.js"></script>
  <script src="js/groove.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/research.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
